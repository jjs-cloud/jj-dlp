[General]

# Comma-separated list of drives or paths to show disk info in the system panel. (e.g. C:\, D:\, E:\  or  /home,/mnt/data).
DISK_DRIVES = 

# Enable debug logging to a file(true/false).
DEBUG_LOGS = false

# Path for the debug log file. Can be a relative or absolute path (e.g. logs/debug.log)
DEBUG_LOG_PATH = logs/debug.log

# Whether to check for app updates at startup and periodically (true/false).
CHECK_FOR_UPDATES = true

# Number of minutes between app update checks.
UPDATE_INTERVAL = 30

# Which branch of jj-dlp to update to. (main, testing, or experimental).
UPDATE_BRANCH = main

# Show the browser chooser on startup (true/false).
ASK_FOR_BROWSER = true

# Show the config file chooser on startup (true/false).
ASK_FOR_CONFIG = true

# The maximum number of simultaneous recordings allowed to run.  Use the STREAMER SETTINGS panel in the Config tab to adjust the priority of each streamer. (0=no limit)
MAX_CONCURRENT_REC = 0

# Order to display streamers on each site panel.   This can also be adjusted by pressing the S key on the Dashboard tab.
SITE_SORT = last_live_desc

# When any recording reaches the ffmpeg error threshold (FF_ERR_THRESH) lower the video qualtiy of the lowest priority streamer, freeing up bandwidth for the remaining streamers.
LQ_DOWNLOADER = false

# Restart the download if we see this many ffmpeg errors ("timestamp discontinuity", "Packet corrupt") default: 200
FF_ERR_THRESH = 200

# Save recordings into a subfolder named after the streamer inside OUTPUT_DIR (true/false).
SUBFOLDERS = false

# The topic name to use for ntfy.sh notifications. (example: jj-dlp-fj48dh734fk) Refer to docs/ntfy-setup.md for a detailed setup guide. (blank = disabled)
NTFY_TOPIC = 

# Confirm the recording has actually started before sending a live notification.  Note: When enabled, the notifications will be delayed by a few seconds until the file has been confirmed.
NOTIFY_CONFIRM_FILE = true

# If the recording file cannot be confirmed (does not exist or no file growth) within one STALL_TIMEOUT, send a warning notification that the file could not be confirmed.
NOTIFY_NO_CONFIRM_FILE = true

# When streamers overflow the panel, compact view shows them in 2 columns without progress bars. (auto/true/false)
COMPACT_VIEW = auto

# A list of destination paths where you might want to move your files.  Used in the File Manager tab. (e.g. C:\\My Recordings  OR /home/greg/twitch)")
DESTINATIONS = 

# Enable the read-only web dashboard, viewable from a browser on your local network (e.g. Safari on iPhone). Requires WEB_UI_USER and WEB_UI_PASS to also be set. (true/false)")
WEB_UI = false

# Port for the web dashboard. Visit http://<this-pc-ip>:<port> from another device, or http://127.0.0.1:<port> on this PC.")
WEB_UI_PORT = 8765

# Username required to log into the web dashboard (HTTP Basic Auth). Required if WEB_UI is enabled.")
WEB_UI_USER = 

# Password required to log into the web dashboard (HTTP Basic Auth). Required if WEB_UI is enabled. Choose something not easily guessed — anyone on your WiFi could otherwise try to log in.")
WEB_UI_PASS = 

