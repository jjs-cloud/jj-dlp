[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jj-dlp"
version = "0.1.0"
description = "Multi-site stream recorder built on yt-dlp."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
jj-dlp = "jj_dlp.__main__:main"

[tool.setuptools.packages.find]
include = ["jj_dlp*"]
